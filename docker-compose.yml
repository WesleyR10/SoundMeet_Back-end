x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Aplicação Principal
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: soundmeet-app
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./envs/.env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://soundmeet:soundmeet123@postgres:5432/soundmeet
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://soundmeet:soundmeet123@rabbitmq:5672
      - AUTH_JWT_VALIDATION_MODE=keycloak
      - KEYCLOAK_URL=http://localhost:8080
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=soundmeet
      - KEYCLOAK_CLIENT_ID=soundmeet-api
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-soundmeet-api-local-secret}
      - KEYCLOAK_MOBILE_CLIENT_ID=soundmeet-mobile
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/soundmeet/protocol/openid-connect/certs
      - KEYCLOAK_JWKS_CACHE_TTL_SECONDS=300
      - KEYCLOAK_VERIFY_AUDIENCE=false
      - AI_CIFRA_ANALYSIS_HTTP_BASE_URL=http://ai-cifra-worker-gpu:8000
      - AI_CIFRA_ANALYSIS_HTTP_PATH=/v2/analyze
      # Shared secret backend → workers de IA (A-10). O MESMO valor nos workers.
      - AI_WORKER_TOKEN=${AI_WORKER_TOKEN:-dev-worker-token}
      - AI_CIFRA_DEFAULT_MODEL_ID=chordformer_v23_continuacao
      - AI_CIFRA_SIMPMUSIC_YTDLP_BIN=yt-dlp
      - AI_CIFRA_MUSIFY_PIPED_BASE_URL=https://api.piped.private.coffee
      - AI_CIFRA_MUSIFY_PIPED_TIMEOUT_MS=10000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=soundmeet
      - MINIO_SECRET_KEY=soundmeet123
      - SWAGGER_EXAMPLES_ENABLED=true
      - SWAGGER_EXAMPLES_REQUIRED_ONLY=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - soundmeet-network
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # PostgreSQL - Banco Principal
  postgres:
    image: postgres:15-alpine
    container_name: soundmeet-postgres
    environment:
      POSTGRES_DB: soundmeet
      POSTGRES_USER: soundmeet
      POSTGRES_PASSWORD: soundmeet123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundmeet -d soundmeet"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-keycloak:
    image: postgres:15-alpine
    container_name: soundmeet-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: soundmeet
      # Precisa ficar igual ao KC_DB_PASSWORD do serviço keycloak abaixo —
      # mesma env var nos dois para não dessincronizar (SM-014).
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-soundmeet123}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundmeet -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  # MongoDB (analytics/logs) foi removido junto com mongoose/@nestjs/mongoose:
  # o backend não tinha um único @Schema/InjectModel — só abria a conexão.
  # Restaurar no item 7.4 do roadmap, quando houver telemetria de volume.

  # Redis - Cache e Sessões
  redis:
    image: redis:7-alpine
    container_name: soundmeet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # RabbitMQ - Mensageria
  rabbitmq:
    build:
      context: ./docker/rabbitmq-delayed
    image: soundmeet-rabbitmq-delayed:3.12-management-alpine
    container_name: soundmeet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: soundmeet
      RABBITMQ_DEFAULT_PASS: soundmeet123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Keycloak - Autenticação
  #
  # ⚠️ DEV-ONLY (SM-014) — `start-dev`, HTTP sem TLS e KC_HOSTNAME_STRICT=false
  # são inseguros por design e o próprio Keycloak documenta isso. Este bloco
  # NUNCA deve ser promovido a produção sem revisão — usar o compose dedicado
  # em `infra/keycloak/docker-compose.prod.yml` (start, TLS, hostname estrito,
  # segredos via secret manager).
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: soundmeet-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: soundmeet
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-soundmeet123}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      # Email — usados pelo realm-soundmeet.json via ${env.VAR} no import
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@soundmeet.com.br}
    volumes:
      - ./infra/keycloak/realm-soundmeet.json:/opt/keycloak/data/import/realm-soundmeet.json:ro
      # Tema de login do SoundMeet (AUTH-1). Build:
      #   cd ../soundmeet-keycloak-theme && npm ci && npm run build-keycloak-theme
      #
      # 🔴 O jar `22-to-25` e não o `all-other-versions`: a imagem acima é a
      # 22.0, e o outro jar cobre 11–21 e 26+. Trocar os dois faz o Keycloak
      # subir normalmente e simplesmente ignorar o tema.
      # ⚠️ `${...:-/dev/null}` mantém o compose subindo mesmo sem o tema
      # construído — o login volta ao padrão do Keycloak em vez de quebrar o
      # boot de quem só quer rodar a API.
      - ${SOUNDMEET_KC_THEME_JAR:-../soundmeet-keycloak-theme/dist_keycloak/keycloak-theme-for-kc-22-to-25.jar}:/opt/keycloak/providers/soundmeet-theme.jar:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    command: start-dev --import-realm
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s

  # MinIO - Armazenamento S3 Local (para desenvolvimento)
  minio:
    image: minio/minio:latest
    container_name: soundmeet-minio
    environment:
      MINIO_ROOT_USER: soundmeet
      MINIO_ROOT_PASSWORD: soundmeet123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  # Adminer - Interface de Banco
  adminer:
    image: adminer:latest
    container_name: soundmeet-adminer
    ports:
      - "8083:8080"
    depends_on:
      - postgres
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  ai-cifra-worker:
    build:
      context: ./ai-cifra-mir-worker
      dockerfile: Dockerfile
    container_name: soundmeet-ai-cifra-worker
    init: true
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - /home/wesleyr10/Programação/Projetos/SoundMeet:/home/wesleyr10/Programação/Projetos/SoundMeet
    environment:
      - AI_CIFRA_STORAGE_PROVIDER=minio
      - AI_CIFRA_ANALYSIS_HTTP_PATH=/v2/analyze
      # A-10: valida o header do backend (fail-closed). Mesmo valor do serviço app.
      - AI_WORKER_TOKEN=${AI_WORKER_TOKEN:-dev-worker-token}
      - AI_CIFRA_ENABLE_NEURAL_CHORDS=true
      - AI_CIFRA_OMAR_RQ_DEVICE=cpu
      - AI_CIFRA_MAX_AUDIO_SECONDS=800
      - HF_HOME=/home/wesleyr10/Programação/Projetos/SoundMeet/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/wesleyr10/Programação/Projetos/SoundMeet/.cache/huggingface
      - AWS_REGION=us-east-1
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=soundmeet
      - MINIO_SECRET_KEY=soundmeet123
      - MINIO_BUCKET=soundmeet-media
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - minio
      - redis
    networks:
      - soundmeet-network
    logging: *default-logging

  ai-cifra-worker-gpu:
    build:
      context: ./ai-cifra-mir-worker
      dockerfile: Dockerfile
      target: gpu-runtime
    container_name: soundmeet-ai-cifra-worker-gpu
    profiles: ["gpu"]
    init: true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8002:8000"
    volumes:
      # `:ro` protege os checkpoints de treino de serem sobrescritos pelo
      # worker — isso é deliberado e fica.
      - ./ai-cifra-mir-worker/artifacts:/app/artifacts:ro
      # 🔴 EXCEÇÃO: o cache de stems do Demucs precisa de ESCRITA.
      #
      # Com o volume inteiro em `:ro`, toda análise falhava ao gravar o cache
      # (`[Errno 30] Read-only file system` em artifacts/stems_cache/demucs/)
      # e refazia a separação do zero — inclusive para uma música já analisada
      # antes. Foi boa parte dos 3–12 min por faixa medidos em 24/ago.
      #
      # Montagem filha sobrepõe a do pai para este caminho: os checkpoints
      # seguem protegidos, só o cache fica gravável.
      - ./ai-cifra-mir-worker/artifacts/stems_cache:/app/artifacts/stems_cache:rw
      - /root/.cache/huggingface:/root/.cache/huggingface
    environment:
      - AI_CIFRA_STORAGE_PROVIDER=minio
      - AI_CIFRA_ANALYSIS_HTTP_PATH=/v2/analyze
      # A-10: valida o header do backend (fail-closed). Mesmo valor do serviço app.
      - AI_WORKER_TOKEN=${AI_WORKER_TOKEN:-dev-worker-token}
      - AI_CIFRA_ENABLE_NEURAL_CHORDS=1
      - AI_CIFRA_OMAR_RQ_DEVICE=cuda
      - AI_CIFRA_MAX_AUDIO_SECONDS=600
      - AWS_REGION=us-east-1
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=soundmeet
      - MINIO_SECRET_KEY=soundmeet123
      - MINIO_BUCKET=soundmeet-media
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - minio
      - redis
    networks:
      - soundmeet-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Separação de stems (Demucs/MSST) — consumido pelo ai-audio-module via
  # AI_AUDIO_SEPARATION_HTTP_BASE_URL. Só existe imagem GPU
  # (soundmeet-audio-separation/Dockerfile.gpu), daí o profile "gpu", igual ao
  # ai-cifra-worker-gpu. O contexto é a raiz do monorepo porque o Dockerfile
  # copia de soundmeet-audio-separation/.
  #
  # ⚠️ SUBA UM WORKER DE GPU POR VEZ em placa de 8GB. Medido em 28/jul/2026
  # numa RTX 2060 SUPER (8GB): o ai-cifra-worker-gpu sozinho já reserva
  # ~7,7GB. Com este serviço também de pé — mesmo ocioso — o e2e do ai-cifra
  # foi de 293s para 3603s (timeout), 12x mais lento. Não é contenção de
  # paralelismo do Jest: é VRAM, e `--runInBand` não resolve.
  #   docker compose --profile gpu up -d ai-cifra-worker-gpu   # análise de cifra
  #   docker compose --profile gpu up -d ai-audio-separation   # separação de stems
  # Parar o outro antes de subir. Em placa com folga (>=16GB), coexistem.
  ai-audio-separation:
    build:
      context: ..
      dockerfile: soundmeet-audio-separation/Dockerfile.gpu
    container_name: soundmeet-ai-audio-separation
    profiles: ["gpu"]
    init: true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      - ../soundmeet-audio-separation/models:/app/models:ro
      - /root/.cache/huggingface:/root/.cache/huggingface
    environment:
      - AI_AUDIO_STORAGE_PROVIDER=minio
      - AI_AUDIO_PROGRESS_URL=http://app:3000/api/v1/ai-audio/internal/separations
      - AI_AUDIO_PROGRESS_TOKEN=${AI_AUDIO_PROGRESS_TOKEN:-change-me}
      # A-10: valida o header do backend (fail-closed). Mesmo valor do serviço app.
      - AI_WORKER_TOKEN=${AI_WORKER_TOKEN:-dev-worker-token}
      - AWS_REGION=us-east-1
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=soundmeet
      - MINIO_SECRET_KEY=soundmeet123
      - MINIO_BUCKET=soundmeet-media
    depends_on:
      - minio
    networks:
      - soundmeet-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  ai-cifra-train:
    build:
      context: ..
      dockerfile: soundmeet-backend/ai-cifra-mir-worker/Dockerfile.train
    image: soundmeet-ai-cifra-train:local
    container_name: soundmeet-ai-cifra-train
    profiles: ["train"]
    init: true
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /home/wesleyr10/Programação/Projetos/SoundMeet/soundmeet-backend/ai-cifra-mir-worker
    volumes:
      - /home/wesleyr10/Programação/Projetos/SoundMeet:/home/wesleyr10/Programação/Projetos/SoundMeet
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - HF_HOME=/home/wesleyr10/Programação/Projetos/SoundMeet/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/wesleyr10/Programação/Projetos/SoundMeet/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command:
      - bash
      - -lc
      - |
        set -eux
        # Ignora o script de reparo pois estamos usando o diretorio audio_raw (mp3) fornecido
        # python tools/repair_chords1217_audio_from_hf.py --audio-dir ... --prefer-local-zip

        # O script de treino vai procurar os arquivos em audio_raw
        python tools/marble_fit_omar_rq_crnn.py \
          --data-dir artifacts/datasets/chords1217_guitarset_mic_v2 \
          --out-dir artifacts/marble_runs/omar_rq_crnn_v2 \
          --omar-model-id mtg-upf/omar-rq-multifeature-25hz-fsq \
          --audio-backend soundfile \
          --force-prepare \
          --include-guitarset --guitarset-audio mic --guitarset-val-ratio 0.1 \
          --accelerator auto --devices 1 \
          --omar-device cuda \
          --max-epochs 30 \
          --limit-train-batches 1.0 --limit-val-batches 1.0 \
          --num-sanity-val-steps 0 \
          --time-dim-mismatch-tol 64 \
          --batch-size 2 \
          --num-workers 4 \
          --clip-seconds 30
        chown -R 1000:1000 artifacts || true

  ai-cifra-export:
    build:
      context: ..
      dockerfile: soundmeet-backend/ai-cifra-mir-worker/Dockerfile.train
    image: soundmeet-ai-cifra-train:local
    container_name: soundmeet-ai-cifra-export
    profiles: ["train"]
    init: true
    restart: "no"
    working_dir: /home/wesleyr10/Programação/Projetos/SoundMeet/soundmeet-backend/ai-cifra-mir-worker
    volumes:
      - /home/wesleyr10/Programação/Projetos/SoundMeet:/home/wesleyr10/Programação/Projetos/SoundMeet
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONUTF8=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - HF_HOME=/home/wesleyr10/Programação/Projetos/SoundMeet/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/wesleyr10/Programação/Projetos/SoundMeet/.cache/huggingface
    command:
      - bash
      - -lc
      - |
        set -eux

        CKPT_PATH="$$(ls -t artifacts/marble_runs/omar_rq_crnn_v2/checkpoints/last*.ckpt 2>/dev/null | head -n 1)"
        if [ -z "$$CKPT_PATH" ]; then
          echo "nenhum checkpoint encontrado em artifacts/marble_runs/omar_rq_crnn_v2/checkpoints" 1>&2
          exit 1
        fi
        python tools/marble_export_crnn_head.py \
          --ckpt "$$CKPT_PATH" \
          --out-dir artifacts/exports/omar_rq_crnn_v2 \
          --export-onnx

        python tools/build_chordonomicon_prior.py \
          --chordonomicon-hf \
          --max-rows 0 \
          --out artifacts/exports/omar_rq_crnn_v2/chord_prior.json

        python tools/write_export_manifest.py \
          --dataset-dir artifacts/datasets/chords1217_guitarset_mic_v2 \
          --exports-dir artifacts/exports/omar_rq_crnn_v2 \
          --expect-chords1217 1217 \
          --require-no-missing-audio
        chown -R 1000:1000 artifacts || true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: soundmeet-cadvisor
    profiles: ["ops"]
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  dozzle:
    image: amir20/dozzle:v7.0.5
    container_name: soundmeet-dozzle
    profiles: ["ops"]
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: soundmeet-uptime-kuma
    profiles: ["ops"]
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  postgres_keycloak_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  uptime_kuma_data:
  model-cache:

networks:
  soundmeet-network:
    driver: bridge
