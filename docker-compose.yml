
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Aplicação Principal
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: soundmeet-app
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./envs/.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://soundmeet:soundmeet123@postgres:5432/soundmeet
      - MONGODB_URL=mongodb://soundmeet:soundmeet123@mongo:27017/soundmeet?authSource=admin
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://soundmeet:soundmeet123@rabbitmq:5672
      - KEYCLOAK_URL=http://keycloak:8080
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=soundmeet
      - MINIO_SECRET_KEY=soundmeet123
    depends_on:
      postgres:
        condition: service_started
      mongo:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - soundmeet-network
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # PostgreSQL - Banco Principal
  postgres:
    image: postgres:15-alpine
    container_name: soundmeet-postgres
    environment:
      POSTGRES_DB: soundmeet
      POSTGRES_USER: soundmeet
      POSTGRES_PASSWORD: soundmeet123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundmeet -d soundmeet"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-keycloak:
    image: postgres:15-alpine
    container_name: soundmeet-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: soundmeet
      POSTGRES_PASSWORD: soundmeet123
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundmeet -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  # MongoDB - Analytics e Logs
  mongo:
    image: mongo:7.0
    container_name: soundmeet-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: soundmeet
      MONGO_INITDB_ROOT_PASSWORD: soundmeet123
      MONGO_INITDB_DATABASE: soundmeet
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "soundmeet",
          "--password",
          "soundmeet123",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.runCommand({ ping: 1 })",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  # Redis - Cache e Sessões
  redis:
    image: redis:7-alpine
    container_name: soundmeet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # RabbitMQ - Mensageria
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: soundmeet-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: soundmeet
      RABBITMQ_DEFAULT_PASS: soundmeet123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Keycloak - Autenticação
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: soundmeet-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: soundmeet
      KC_DB_PASSWORD: soundmeet123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    command: start-dev
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s

  # MinIO - Armazenamento S3 Local (para desenvolvimento)
  minio:
    image: minio/minio:latest
    container_name: soundmeet-minio
    environment:
      MINIO_ROOT_USER: soundmeet
      MINIO_ROOT_PASSWORD: soundmeet123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  # Adminer - Interface de Banco
  adminer:
    image: adminer:latest
    container_name: soundmeet-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - mongo
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: soundmeet-cadvisor
    profiles: ["ops"]
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  dozzle:
    image: amir20/dozzle:v7.0.5
    container_name: soundmeet-dozzle
    profiles: ["ops"]
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: soundmeet-uptime-kuma
    profiles: ["ops"]
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - soundmeet-network
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  postgres_keycloak_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  uptime_kuma_data:

networks:
  soundmeet-network:
    driver: bridge
