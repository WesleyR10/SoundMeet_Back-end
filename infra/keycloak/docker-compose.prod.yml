## Keycloak — deploy de produção (SM-014)
#
# Compose SEPARADO do docker-compose.yml da raiz (que é dev-only: start-dev,
# HTTP sem TLS, KC_HOSTNAME_STRICT=false). Este arquivo corrige os 5 pontos
# do achado de auditoria:
#   1. `command: start` (não start-dev) — start-dev desliga otimizações e o
#      próprio Keycloak documenta como inseguro para expor.
#   2. TLS termina no reverse proxy (nginx/Traefik/ALB) na mesma rede
#      Docker — Keycloak nunca fala HTTP puro fora dessa rede interna.
#      Alternativa: TLS direto no Keycloak via KC_HTTPS_CERTIFICATE_FILE /
#      KC_HTTPS_CERTIFICATE_KEY_FILE (ver comentário no serviço abaixo) se
#      não houver proxy na frente.
#   3. KC_HOSTNAME aponta para o domínio real, KC_HOSTNAME_STRICT=true.
#   4. Nenhum segredo em texto — tudo vem de env externa (secret
#      manager/CI), nunca de default hardcoded.
#   5. Imagem fixada por digest, não só por tag mutável.
#
# Uso:
#   docker compose -f infra/keycloak/docker-compose.prod.yml \
#     --env-file infra/keycloak/.env.prod up -d
#
# Antes do primeiro deploy, resolva o digest verificado da versão que for
# usar (ver roadmap Fase 4c — migração 22→26 antes de ir para produção):
#   docker buildx imagetools inspect quay.io/keycloak/keycloak:26.4
# e copie o "Digest: sha256:..." para KEYCLOAK_IMAGE_DIGEST no .env.prod.
# Nunca aponte para uma tag solta (ex.: ":latest" ou ":26") em produção — a
# tag pode mudar de conteúdo sem aviso, o digest não.

services:
  keycloak:
    image: "quay.io/keycloak/keycloak@${KEYCLOAK_IMAGE_DIGEST:?defina KEYCLOAK_IMAGE_DIGEST (sha256:...) no .env.prod}"
    container_name: soundmeet-keycloak-prod
    command: start
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USERNAME:?obrigatorio}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?obrigatorio - vem do secret manager, nunca hardcoded}"
      KC_DB: postgres
      KC_DB_URL: "${KC_DB_URL:?obrigatorio}"
      KC_DB_USERNAME: "${KC_DB_USERNAME:?obrigatorio}"
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:?obrigatorio - vem do secret manager, nunca hardcoded}"

      # Hostname estrito: rejeita requisições para qualquer Host header que
      # não seja o domínio real — mitiga host header injection / redirect
      # malicioso em fluxos OAuth (parte do achado original).
      KC_HOSTNAME: "${KEYCLOAK_HOSTNAME:?defina o dominio real, ex. auth.soundmeet.com.br}"
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"

      # TLS termina no reverse proxy da mesma rede Docker; Keycloak escuta
      # HTTP só dentro da rede interna e confia no cabeçalho X-Forwarded-*
      # do proxy (KC_PROXY substitui KC_PROXY_HEADERS nas versões atuais —
      # confirmar o nome exato na versão escolhida na Fase 4c).
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: forwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # E-mail (mesmas vars do realm-soundmeet.json usado no dev)
      RESEND_API_KEY: "${RESEND_API_KEY:?obrigatorio}"
      MAIL_FROM: "${MAIL_FROM:?obrigatorio}"
    # Sem `ports:` publicado no host — só o reverse proxy da rede interna
    # alcança a porta 8080. Ajuste se o proxy rodar fora deste compose.
    expose:
      - "8080"
    networks:
      - keycloak-internal
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 30s

networks:
  keycloak-internal:
    # Rede compartilhada com o reverse proxy (nginx/Traefik) que faz o
    # terminamento TLS. Se o proxy já roda em outro compose/stack, troque
    # por uma rede `external: true` apontando para ele.
    driver: bridge

# --- Alternativa sem reverse proxy: TLS direto no Keycloak ---
# Se não houver proxy na frente, troque KC_HTTP_ENABLED por:
#   KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/tls.crt
#   KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/tls.key
# e monte os certificados via volume (nunca copiados para a imagem/commitados
# no repo). Publique a 8443 em vez de usar `expose` com o proxy.
